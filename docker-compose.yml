version: '3.9'

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16
    container_name: career-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-appuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secretpassword}
      POSTGRES_DB: ${DB_NAME:-careerdb}
    ports:
      - "5433:5432"          # expose to host for Adminer / local dev tools
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-appuser} -d ${DB_NAME:-careerdb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Go Backend ──────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: career-backend
    restart: unless-stopped
    ports:
      - "${PORT:-4546}:4546"
    environment:
      # Server
      PORT: 4546
      GIN_MODE: ${GIN_MODE:-release}
      # Database — use 'db' as host (Docker internal network name)
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-appuser}
      DB_PASSWORD: ${DB_PASSWORD:-secretpassword}
      DB_NAME: ${DB_NAME:-careerdb}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      # CORS
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-24h}
      # Gemini
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      db:
        condition: service_healthy   # wait until Postgres is ready

  # ── Adminer (DB GUI) ────────────────────────────────────────────────────────
  adminer:
    image: adminer:latest
    container_name: career-adminer
    restart: unless-stopped
    ports:
      - "8090:8080"
    depends_on:
      - db

volumes:
  postgres_data:
